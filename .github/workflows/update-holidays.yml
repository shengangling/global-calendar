name: 更新各国公共假期
# 浏览器不能跨域读取 Google 公共假期日历，这里每天在服务器端抓取一次，结果提交为 netdata.json，网页从同站读取。
on:
  schedule:
    - cron: '17 */6 * * *'   # 每 6 小时
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/gen-netdata.js
      - name: 提交更新
        run: |
          if git diff --quiet netdata.json; then echo "无变化"; exit 0; fi
          git config user.name "holiday-bot"
          git config user.email "holiday-bot@users.noreply.github.com"
          git add netdata.json
          git commit -m "更新公共假期数据 $(date -u +%F)"
          git push
